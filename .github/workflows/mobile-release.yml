name: Android production release

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Permanent HTTPS SafiRoute API URL, including /api"
        required: true
        type: string
      version_name:
        description: "Android version name, for example 1.0.0"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "Monotonically increasing Android version code"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  play-aab:
    name: Signed Play AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SAFIROUTE_API: ${{ inputs.api_url }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production release inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$SAFIROUTE_API" in
            https://*/api|https://*/api/) ;;
            *) echo "api_url must be a permanent HTTPS URL ending in /api"; exit 1 ;;
          esac
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS secret is missing"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD secret is missing"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "ANDROID_STORE_PASSWORD secret is missing"; exit 1; }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: mobile
        run: |
          flutter create --platforms=android --org com.safisana --project-name safiroute .
          python3 tool/prepare_platforms.py

      - name: Install dependencies and brand app
        working-directory: mobile
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Quality gates
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Configure organization release signing
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python3 tool/prepare_android_signing.py

      - name: Build obfuscated signed AAB
        working-directory: mobile
        run: |
          flutter build appbundle --release \
            --build-name="${{ inputs.version_name }}" \
            --build-number="${{ inputs.version_code }}" \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=SAFIROUTE_API="$SAFIROUTE_API"

      - name: Generate checksum
        working-directory: mobile
        run: sha256sum build/app/outputs/bundle/release/app-release.aab > build/SafiRoute-Android-AAB.sha256

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SafiRoute-Android-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/SafiRoute-Android-AAB.sha256
            mobile/build/symbols/**
          if-no-files-found: error
